[project]
name = "shadowcoach"
version = "4.0.0"
description = "Lokales, lesendes MCP-Analyse-Center für Intervals.icu"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
